<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the shared Wagner Luca light/dark choice before first paint (see stores/theme.svelte.ts)
			(function() {
				var t = localStorage.getItem('wl-theme');
				if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="margin: 0; padding: 0;">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
