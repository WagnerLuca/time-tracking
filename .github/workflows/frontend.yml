name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# Least privilege by default; only the publish job may write packages
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend
        env:
          # @wagnerluca/ui (optional) lives on GitHub Packages; needs a PAT with read:packages, else the bundled tokens are used
          NODE_AUTH_TOKEN: ${{ secrets.GHP_READ_TOKEN }}

      - name: Check
        run: npm run check
        working-directory: frontend

      # Vitest + v8 coverage; the thresholds in vitest.config.ts fail this step when coverage drops
      - name: Unit tests with coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Coverage summary
        if: always()
        working-directory: frontend
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Frontend unit-test coverage (src/lib/**/*.ts)", "", "| | % | covered |", "|:--|--:|--:|",
              ...["lines", "statements", "functions", "branches"].map(row)].join(String.fromCharCode(10)));
          ' >> "$GITHUB_STEP_SUMMARY"

      # HTML report (open index.html) + lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: npm run build
        working-directory: frontend

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GHP_READ_TOKEN }}
