name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'backend/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/backend.yml'

# Least privilege by default; only the publish job may write packages
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend/tests/TimeTracking.Api.Tests

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend/tests/TimeTracking.Api.Tests

      - name: Check migrations match the model
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.3 # keep in step with Microsoft.EntityFrameworkCore.Design
          dotnet ef migrations has-pending-model-changes
        working-directory: backend

      # Includes the Postgres suite (Testcontainers; Docker is available on ubuntu-latest), not the scaling
      # tests (Category=Perf, minutes of seeding; run them with `dotnet test --filter Category=Perf` or the manual
      # perf.yml workflow). The PerfSmoke query-budget test (Postgres/BalanceQueryBudgetTests) is part of this run.
      # coverage.sh: coverlet (coverlet.runsettings) → ReportGenerator → job summary; fails below its thresholds
      - name: Run tests with coverage
        run: bash coverage.sh --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --filter "Category!=Perf"
        working-directory: backend/tests/TimeTracking.Api.Tests
        env:
          ASPNETCORE_ENVIRONMENT: Testing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/tests/TimeTracking.Api.Tests/**/test-results.trx
          retention-days: 14

      # HTML report (open index.html) + merged Cobertura.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/tests/TimeTracking.Api.Tests/TestResults/coverage-report/
          retention-days: 14
          if-no-files-found: ignore

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
