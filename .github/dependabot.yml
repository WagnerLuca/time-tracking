# Weekly dependency PRs. @wagnerluca/ui (optional, GitHub Packages) is ignored and updated by hand,
# so the npm updates need no registry secret.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "@wagnerluca/ui"
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly }
    groups:
      nuget-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
